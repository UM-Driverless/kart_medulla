[platformio]
src_dir = main

[env:esp32dev]
platform = espressif32@6.4.0
board = esp32dev
framework = espidf
; 115200 to match km_coms.c KM_COMS_Init's .baud_rate — the only live UART baud in
; the firmware. This said 460800 until 2026-07-26, which would have printed garbage;
; nothing in components/ or main/ has ever configured 460800 (the km_gpio.c UART
; blocks that might have are commented out).
monitor_speed = 115200
; The classic board's CP2102 really does fail flashing above this. Do not copy this
; number to the S3 env — different bridge, see below.
upload_speed = 115200

board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.f_flash = 40000000

; ESP32-S3 — the real kart-medulla PCB. Pin map lives in km_gpio.h under
; CONFIG_IDF_TARGET_ESP32S3 (see .agents/esp32s3-pinmap.md).
; NOTE: does NOT link yet — throttle/brake DAC (MCP4922 over SPI), PCF8574,
; and the safety-pin/watchdog drive are still gaps. This env exists so the
; S3 pin map is buildable-in-progress, not because a working S3 image exists.
[env:esp32-s3-devkitc-1]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
; 921600, not 115200. The 115200 cap is a CP2102 limitation and the CP2102 is on the
; CLASSIC board — this board's bridge is a WCH CH343, rated 50 bps to 6 Mbps
; (datasheet: ~/dv/datasheets/ch343_wch_datasheet.pdf). The S3 env had simply
; inherited the other board's number, so every flash ran ~8x slower than the hardware
; allows: at 115200 esptool moves ~11.5 KB/s, and this image links btstack +
; bluepad32, so it is a minute-plus of waiting per flash.
; UNVERIFIED on hardware as of 2026-07-26 — raised from reading the datasheets, not
; from a successful flash. If it fails to connect or the write verify fails, drop back
; to 115200 (one line) and note it here. 460800 is the intermediate step worth trying
; before giving up. Faster still, if ever needed: the S3's native USB port
; (silkscreened `USB`, USB-Serial-JTAG on GPIO 19/20) flashes at USB speed and ignores
; this setting entirely — but that changes which port carries serial, so read the
; CDC_ON_BOOT notes in AGENTS.md before switching cables.
upload_speed = 921600

; BRANCH `spi-fix` ONLY — do not merge this flag to dev.
; Keeps ESP_LOG enabled and runs KM_GPIO_McpSelfTest() at boot so the MCP4922
; can be diagnosed with a voltmeter. Logging on UART0 corrupts the binary
; protocol, so a board flashed with this must not be run with kart-brain live.
build_flags = -D SPI_DIAG_LOGS=1

board_build.flash_size = 16MB

[env:native]
platform = native
build_flags =
    -I test/fakes
    -I components/km_pid
    -I components/km_act
    -I components/km_coms
    -I components/km_objects
    -I components/km_sdir
    -I components/km_gpio
    -D UNIT_TEST
test_build_src = false

